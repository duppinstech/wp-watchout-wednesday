name: Release

# Push a tag like v1.2.0 (matching `Version:` in watch-out-wednesday.php).
# Builds the zip and creates the GitHub Release with the zip attached in one step,
# so an updater never sees a release without its asset.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 sh -c 'php -l "$0" || exit 1' > "$RUNNER_TEMP/lint.log" 2>&1 \
            || { grep -v '^No syntax errors' "$RUNNER_TEMP/lint.log"; exit 1; }

      - name: Unit tests
        run: |
          composer install --no-interaction --prefer-dist
          vendor/bin/phpunit

      - name: Check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version:[[:space:]]*//p' watch-out-wednesday.php | head -1 | tr -d '\r')"
          constant="$(sed -n "s/^define( 'WOW_VERSION', '\([^']*\)' );/\1/p" watch-out-wednesday.php | tr -d '\r')"
          stable="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')"
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          [ "$tag" = "$header" ] && [ "$tag" = "$constant" ] && [ "$tag" = "$stable" ] || { echo "::error::Tag v$tag does not match plugin Version, WOW_VERSION, and readme Stable tag"; exit 1; }

      - name: Build zip
        run: bash bin/build-zip.sh "$PWD/watch-out-wednesday.zip"

      - name: Verify zip layout
        run: |
          unzip -Z1 watch-out-wednesday.zip > zip-list.txt
          bad="$(grep -v '^watch-out-wednesday/' zip-list.txt || true)"
          [ -z "$bad" ] || { echo "::error::Unexpected paths in zip:"; echo "$bad"; exit 1; }
          grep -qx 'watch-out-wednesday/watch-out-wednesday.php' zip-list.txt || { echo "::error::Main file missing from zip"; exit 1; }
          leaked="$(grep -E '^watch-out-wednesday/(\.claude|\.github|tests|CLAUDE|AGENTS)' zip-list.txt || true)"
          [ -z "$leaked" ] || { echo "::error::Dev files in zip (check .distignore):"; echo "$leaked"; exit 1; }
          secret="$(grep -E '^watch-out-wednesday/(\.git|\.env)' zip-list.txt || true)"
          [ -z "$secret" ] || { echo "::error::Git or env paths in zip:"; echo "$secret"; exit 1; }

      - name: Write release notes
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" watch-out-wednesday.php release-notes.md

      - name: Create release (or update the asset if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" watch-out-wednesday.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" watch-out-wednesday.zip \
              --title "Watch Out Wednesday $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
