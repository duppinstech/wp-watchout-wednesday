name: CI

on:
  pull_request:

jobs:
  syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer
      - name: php -l
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: |
          composer install --no-interaction --prefer-dist
          vendor/bin/phpunit
      - name: Release notes for the current version
        run: |
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' watch-out-wednesday.php | tr -d '\r')
          bash bin/release-notes.sh "$version" watch-out-wednesday.php "$RUNNER_TEMP/release-notes.md"
